  <head>
    <style>
    html, body {
      width:  100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0a0a0a;
    }
    </style>
    <script src="//ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
    <script type="text/javascript">
    $(document).ready( function(){
        var canvas = $('#three');
        var ctx = canvas.get(0).getContext('2d');
        var container = $(canvas).parent();
        $(window).resize(respondCanvas);
        function respondCanvas(){
            canvas.attr('width', $(container).width());
            canvas.attr('height', $(container).height());

            ctx.save();
            ctx.translate(ctx.canvas.width/2, ctx.canvas.height/2);
            draw_cube(ctx, ctx.canvas.width/5, 0);
            draw_cube(ctx, ctx.canvas.width/10, 0);
            ctx.restore();
        }
        respondCanvas();

    });

    function draw_side(ctx, scale, colour){
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.lineTo(Math.sqrt(3)/2 * scale, 0.5 * scale);
        ctx.lineTo(0, scale);
        ctx.lineTo(- Math.sqrt(3)/2 * scale, 0.5 * scale);
        ctx.closePath();
        ctx.fillStyle = colour;
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = "white";
        ctx.stroke();
        ctx.restore();
    }

    function draw_cube(ctx, scale, space){
        ctx.save();
        ctx.translate(0, -space);
        ctx.rotate(180 * Math.PI / 180);
        draw_side(ctx, scale, "#0a0a0a");
        ctx.restore();

        ctx.save();
        ctx.translate(-space/2, 0);
        ctx.rotate(60 * Math.PI / 180);
        draw_side(ctx, scale, "#0a0a0a");
        ctx.restore();

        ctx.save();
        ctx.translate(space/2, 0);
        ctx.rotate(-60 * Math.PI / 180);
        draw_side(ctx, scale, "#0a0a0a");
        ctx.restore();
    }
    </script>
  </head>
  <body>
    <canvas id="three"></canvas>
